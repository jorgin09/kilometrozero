<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <!-- split background -->
  <rect x="0" y="0" width="450" height="560" fill="#24241e" />
  <rect x="450" y="0" width="450" height="560" fill="#f3f0e4" />

  <!-- K -->
  <rect x="70" y="90" width="64" height="330" fill="#f3f0e4" />
  <rect x="134" y="186" width="185" height="64" fill="#f3f0e4" transform="rotate(-38 134 218)" />
  <rect x="134" y="300" width="185" height="64" fill="#f3f0e4" transform="rotate(38 134 332)" />

  <!-- mountain "M": one jagged ridge, colored per the side it sits on -->
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="450" height="560" />
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="450" y="0" width="450" height="560" />
    </clipPath>
    <polygon
      id="ridge"
      points="330,420 352,328 380,358 408,300 450,145 478,235 500,270 528,215 560,255 580,120 605,255 628,300 650,355 680,420"
    />
  </defs>
  <use href="#ridge" fill="#f3f0e4" clip-path="url(#leftHalf)" />
  <use href="#ridge" fill="#24241e" clip-path="url(#rightHalf)" />

  <!-- cloud above the left peak -->
  <g fill="#f3f0e4">
    <circle cx="423" cy="122" r="19" />
    <circle cx="448" cy="102" r="25" />
    <circle cx="476" cy="116" r="21" />
    <circle cx="458" cy="132" r="17" />
  </g>

  <!-- 0 -->
  <path
    fill-rule="evenodd"
    fill="#24241e"
    d="M760,180 a110,110 0 1 1 0,220 a110,110 0 1 1 0,-220 Z
       M760,242 a48,48 0 1 0 0,96 a48,48 0 1 0 0,-96 Z"
  />

  <!-- ADVENTURE wordmark, one tone so it reads cleanly across both halves -->
  <text
    x="450"
    y="505"
    fill="#71765e"
    font-family="Archivo, Arial, sans-serif"
    font-weight="600"
    font-size="42"
    letter-spacing="16"
    text-anchor="middle"
  >ADVENTURE</text>
</svg>
